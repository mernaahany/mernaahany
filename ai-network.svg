<svg viewBox="0 0 420 300" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Pulse paths: Input(85) → Hidden(210) → Output(335) -->
    <path id="p00" d="M85,90 L210,72"/>
    <path id="p01" d="M85,90 L210,124"/>
    <path id="p10" d="M85,150 L210,72"/>
    <path id="p11" d="M85,150 L210,124"/>
    <path id="p12" d="M85,150 L210,176"/>
    <path id="p21" d="M85,210 L210,124"/>
    <path id="p22" d="M85,210 L210,176"/>
    <path id="p23" d="M85,210 L210,228"/>
    <path id="ph00" d="M210,72  L335,120"/>
    <path id="ph10" d="M210,124 L335,120"/>
    <path id="ph11" d="M210,124 L335,180"/>
    <path id="ph20" d="M210,176 L335,120"/>
    <path id="ph21" d="M210,176 L335,180"/>
    <path id="ph31" d="M210,228 L335,180"/>
  </defs>

  <!-- Background -->
  <rect width="420" height="300" fill="#0A0A14" rx="16"/>

  <!-- Ambient glow blobs -->
  <ellipse cx="85"  cy="150" rx="55"  ry="90"  fill="#312E81" opacity="0.07"/>
  <ellipse cx="210" cy="150" rx="70"  ry="110" fill="#4F46E5" opacity="0.06"/>
  <ellipse cx="335" cy="150" rx="55"  ry="80"  fill="#7C3AED" opacity="0.08"/>

  <!-- Corner labels -->
  <text x="14" y="18" fill="#4F46E5" font-family="monospace" font-size="8" opacity="0.45" font-weight="bold">AI ENGINEER</text>
  <text x="406" y="18" fill="#6366F1" font-family="monospace" font-size="8" opacity="0.45" text-anchor="end">MERNA HANY</text>

  <!-- Layer labels -->
  <text x="85"  y="36" fill="#4F46E5" font-family="monospace" font-size="8" text-anchor="middle" opacity="0.4">INPUT</text>
  <text x="210" y="36" fill="#6366F1" font-family="monospace" font-size="8" text-anchor="middle" opacity="0.4">HIDDEN</text>
  <text x="335" y="36" fill="#818CF8" font-family="monospace" font-size="8" text-anchor="middle" opacity="0.4">OUTPUT</text>

  <!-- Dividers -->
  <line x1="148" y1="44" x2="148" y2="258" stroke="#1E1B4B" stroke-width="1" stroke-dasharray="3,9" opacity="0.6"/>
  <line x1="273" y1="44" x2="273" y2="258" stroke="#1E1B4B" stroke-width="1" stroke-dasharray="3,9" opacity="0.6"/>

  <!-- ── Connection lines: Input → Hidden ── -->
  <line x1="85" y1="90"  x2="210" y2="72"  stroke="#3730A3" stroke-width="0.9" opacity="0.55"/>
  <line x1="85" y1="90"  x2="210" y2="124" stroke="#3730A3" stroke-width="0.9" opacity="0.55"/>
  <line x1="85" y1="90"  x2="210" y2="176" stroke="#3730A3" stroke-width="0.5" opacity="0.25"/>
  <line x1="85" y1="90"  x2="210" y2="228" stroke="#3730A3" stroke-width="0.4" opacity="0.15"/>
  <line x1="85" y1="150" x2="210" y2="72"  stroke="#3730A3" stroke-width="0.5" opacity="0.25"/>
  <line x1="85" y1="150" x2="210" y2="124" stroke="#3730A3" stroke-width="0.9" opacity="0.55"/>
  <line x1="85" y1="150" x2="210" y2="176" stroke="#3730A3" stroke-width="0.9" opacity="0.55"/>
  <line x1="85" y1="150" x2="210" y2="228" stroke="#3730A3" stroke-width="0.5" opacity="0.25"/>
  <line x1="85" y1="210" x2="210" y2="72"  stroke="#3730A3" stroke-width="0.4" opacity="0.15"/>
  <line x1="85" y1="210" x2="210" y2="124" stroke="#3730A3" stroke-width="0.5" opacity="0.25"/>
  <line x1="85" y1="210" x2="210" y2="176" stroke="#3730A3" stroke-width="0.9" opacity="0.55"/>
  <line x1="85" y1="210" x2="210" y2="228" stroke="#3730A3" stroke-width="0.9" opacity="0.55"/>

  <!-- ── Connection lines: Hidden → Output ── -->
  <line x1="210" y1="72"  x2="335" y2="120" stroke="#4338CA" stroke-width="0.9" opacity="0.55"/>
  <line x1="210" y1="72"  x2="335" y2="180" stroke="#4338CA" stroke-width="0.4" opacity="0.2"/>
  <line x1="210" y1="124" x2="335" y2="120" stroke="#4338CA" stroke-width="0.9" opacity="0.55"/>
  <line x1="210" y1="124" x2="335" y2="180" stroke="#4338CA" stroke-width="0.6" opacity="0.3"/>
  <line x1="210" y1="176" x2="335" y2="120" stroke="#4338CA" stroke-width="0.6" opacity="0.3"/>
  <line x1="210" y1="176" x2="335" y2="180" stroke="#4338CA" stroke-width="0.9" opacity="0.55"/>
  <line x1="210" y1="228" x2="335" y2="120" stroke="#4338CA" stroke-width="0.4" opacity="0.2"/>
  <line x1="210" y1="228" x2="335" y2="180" stroke="#4338CA" stroke-width="0.9" opacity="0.55"/>

  <!-- ── Animated data pulses ── -->
  <circle r="3" fill="#818CF8" filter="url(#softglow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="0s"><mpath xlink:href="#p00"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle r="2.5" fill="#6366F1" filter="url(#softglow)">
    <animateMotion dur="2.0s" repeatCount="indefinite" begin="0.4s"><mpath xlink:href="#p01"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.0s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle r="2.5" fill="#A78BFA" filter="url(#softglow)">
    <animateMotion dur="1.7s" repeatCount="indefinite" begin="0.9s"><mpath xlink:href="#p11"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.7s" repeatCount="indefinite" begin="0.9s"/>
  </circle>
  <circle r="2.5" fill="#818CF8" filter="url(#softglow)">
    <animateMotion dur="2.1s" repeatCount="indefinite" begin="1.3s"><mpath xlink:href="#p12"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.1s" repeatCount="indefinite" begin="1.3s"/>
  </circle>
  <circle r="3" fill="#6366F1" filter="url(#softglow)">
    <animateMotion dur="1.9s" repeatCount="indefinite" begin="0.6s"><mpath xlink:href="#p22"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.9s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle r="2.5" fill="#818CF8" filter="url(#softglow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" begin="1.0s"><mpath xlink:href="#p23"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.2s" repeatCount="indefinite" begin="1.0s"/>
  </circle>
  <circle r="3" fill="#C4B5FD" filter="url(#softglow)">
    <animateMotion dur="1.6s" repeatCount="indefinite" begin="1.8s"><mpath xlink:href="#ph00"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.6s" repeatCount="indefinite" begin="1.8s"/>
  </circle>
  <circle r="3" fill="#A78BFA" filter="url(#softglow)">
    <animateMotion dur="1.5s" repeatCount="indefinite" begin="2.1s"><mpath xlink:href="#ph10"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.5s" repeatCount="indefinite" begin="2.1s"/>
  </circle>
  <circle r="2.5" fill="#818CF8" filter="url(#softglow)">
    <animateMotion dur="1.8s" repeatCount="indefinite" begin="2.4s"><mpath xlink:href="#ph21"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="1.8s" repeatCount="indefinite" begin="2.4s"/>
  </circle>
  <circle r="2.5" fill="#C4B5FD" filter="url(#softglow)">
    <animateMotion dur="2.0s" repeatCount="indefinite" begin="2.8s"><mpath xlink:href="#ph31"/></animateMotion>
    <animate attributeName="opacity" values="0;1;1;0" dur="2.0s" repeatCount="indefinite" begin="2.8s"/>
  </circle>

  <!-- ══════════════════════════════════ -->
  <!--   INPUT NODES  (x=85): y=90,150,210 -->
  <!-- ══════════════════════════════════ -->
  <!-- Node 0 -->
  <circle cx="85" cy="90" r="15" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.3">
    <animate attributeName="r"       values="15;19;15" dur="3.0s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.0s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="85" cy="90" r="10" fill="#12103A" stroke="#4F46E5" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.0s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="85" cy="90" r="4" fill="#818CF8">
    <animate attributeName="r" values="4;5.2;4" dur="3.0s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <!-- Node 1 -->
  <circle cx="85" cy="150" r="15" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.3">
    <animate attributeName="r"       values="15;19;15" dur="3.6s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.6s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="85" cy="150" r="10" fill="#12103A" stroke="#4F46E5" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.6s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <circle cx="85" cy="150" r="4" fill="#818CF8">
    <animate attributeName="r" values="4;5.2;4" dur="3.6s" repeatCount="indefinite" begin="0.5s"/>
  </circle>
  <!-- Node 2 -->
  <circle cx="85" cy="210" r="15" fill="none" stroke="#4F46E5" stroke-width="1" opacity="0.3">
    <animate attributeName="r"       values="15;19;15" dur="4.2s" repeatCount="indefinite" begin="1.0s"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="4.2s" repeatCount="indefinite" begin="1.0s"/>
  </circle>
  <circle cx="85" cy="210" r="10" fill="#12103A" stroke="#4F46E5" stroke-width="1.8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="4.2s" repeatCount="indefinite" begin="1.0s"/>
  </circle>
  <circle cx="85" cy="210" r="4" fill="#818CF8">
    <animate attributeName="r" values="4;5.2;4" dur="4.2s" repeatCount="indefinite" begin="1.0s"/>
  </circle>

  <!-- ══════════════════════════════════ -->
  <!--  HIDDEN NODES  (x=210): y=72,124,176,228 -->
  <!-- ══════════════════════════════════ -->
  <!-- HNode 0 -->
  <circle cx="210" cy="72" r="14" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.3">
    <animate attributeName="r"       values="14;18;14" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <circle cx="210" cy="72" r="11" fill="#12103A" stroke="#6366F1" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="210" cy="72" r="5" fill="#818CF8">
    <animate attributeName="r" values="5;6.5;5" dur="2.8s" repeatCount="indefinite" begin="0.3s"/>
  </circle>
  <!-- HNode 1 -->
  <circle cx="210" cy="124" r="14" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.3">
    <animate attributeName="r"       values="14;18;14" dur="3.3s" repeatCount="indefinite" begin="0.8s"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.3s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <circle cx="210" cy="124" r="11" fill="#12103A" stroke="#6366F1" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="210" cy="124" r="5" fill="#818CF8">
    <animate attributeName="r" values="5;6.5;5" dur="3.3s" repeatCount="indefinite" begin="0.8s"/>
  </circle>
  <!-- HNode 2 -->
  <circle cx="210" cy="176" r="14" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.3">
    <animate attributeName="r"       values="14;18;14" dur="3.9s" repeatCount="indefinite" begin="0.2s"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="3.9s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <circle cx="210" cy="176" r="11" fill="#12103A" stroke="#6366F1" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="210" cy="176" r="5" fill="#818CF8">
    <animate attributeName="r" values="5;6.5;5" dur="3.9s" repeatCount="indefinite" begin="0.2s"/>
  </circle>
  <!-- HNode 3 -->
  <circle cx="210" cy="228" r="14" fill="none" stroke="#6366F1" stroke-width="1" opacity="0.3">
    <animate attributeName="r"       values="14;18;14" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
    <animate attributeName="opacity" values="0.3;0.05;0.3" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>
  <circle cx="210" cy="228" r="11" fill="#12103A" stroke="#6366F1" stroke-width="1.8" filter="url(#glow)"/>
  <circle cx="210" cy="228" r="5" fill="#818CF8">
    <animate attributeName="r" values="5;6.5;5" dur="2.5s" repeatCount="indefinite" begin="1.2s"/>
  </circle>

  <!-- ══════════════════════════════════ -->
  <!--  OUTPUT NODES  (x=335): y=120,180 -->
  <!-- ══════════════════════════════════ -->
  <!-- ONode 0 -->
  <circle cx="335" cy="120" r="18" fill="none" stroke="#818CF8" stroke-width="1.2" opacity="0.3">
    <animate attributeName="r"       values="18;23;18" dur="3.0s" repeatCount="indefinite" begin="0.6s"/>
    <animate attributeName="opacity" values="0.3;0.04;0.3" dur="3.0s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="335" cy="120" r="13" fill="#12103A" stroke="#818CF8" stroke-width="2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.0s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <circle cx="335" cy="120" r="6" fill="#C4B5FD">
    <animate attributeName="r" values="6;8;6" dur="3.0s" repeatCount="indefinite" begin="0.6s"/>
  </circle>
  <!-- ONode 1 -->
  <circle cx="335" cy="180" r="18" fill="none" stroke="#818CF8" stroke-width="1.2" opacity="0.3">
    <animate attributeName="r"       values="18;23;18" dur="3.5s" repeatCount="indefinite" begin="1.4s"/>
    <animate attributeName="opacity" values="0.3;0.04;0.3" dur="3.5s" repeatCount="indefinite" begin="1.4s"/>
  </circle>
  <circle cx="335" cy="180" r="13" fill="#12103A" stroke="#818CF8" stroke-width="2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.8;1;0.8" dur="3.5s" repeatCount="indefinite" begin="1.4s"/>
  </circle>
  <circle cx="335" cy="180" r="6" fill="#C4B5FD">
    <animate attributeName="r" values="6;8;6" dur="3.5s" repeatCount="indefinite" begin="1.4s"/>
  </circle>

  <!-- Side labels -->
  <text x="48" y="90"  fill="#4F46E5" font-family="monospace" font-size="7" text-anchor="end" dominant-baseline="middle" opacity="0.55">RAW</text>
  <text x="48" y="150" fill="#4F46E5" font-family="monospace" font-size="7" text-anchor="end" dominant-baseline="middle" opacity="0.55">DATA</text>
  <text x="48" y="210" fill="#4F46E5" font-family="monospace" font-size="7" text-anchor="end" dominant-baseline="middle" opacity="0.55">CTX</text>
  <text x="356" y="120" fill="#818CF8" font-family="monospace" font-size="7" text-anchor="start" dominant-baseline="middle" opacity="0.7">LLM</text>
  <text x="356" y="180" fill="#818CF8" font-family="monospace" font-size="7" text-anchor="start" dominant-baseline="middle" opacity="0.7">RAG</text>

  <!-- Bottom signature line -->
  <line x1="14" y1="272" x2="406" y2="272" stroke="#1E1B4B" stroke-width="0.5" opacity="0.6"/>
  <text x="210" y="286" fill="#4F46E5" font-family="monospace" font-size="8.5" text-anchor="middle" opacity="0.45">
    LLM · RAG · Multi-Agent · Multimodal AI
  </text>
</svg>
